services:
  postgres:
    image: postgres:16-alpine
    container_name: rbac-postgres
    environment:
      POSTGRES_DB: rbac
      POSTGRES_USER: rbac
      POSTGRES_PASSWORD: rbac
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rbac -d rbac"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
